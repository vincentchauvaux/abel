<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C45C4A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mimom" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Mimom</title>
    <meta
      name="description"
      content="Suivi du bébé : tétées, couches, biberons, tire-lait, croissance. Un appui, une donnée."
    />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="logo.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f6f1ea;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f1ea;
      }
      #boot-splash.boot-splash-out {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.28s ease;
      }
      .boot-mark {
        position: relative;
        width: 112px;
        height: 112px;
      }
      .boot-ring {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        border: 3px solid #e6ddd4;
        border-top-color: #c45c4a;
        animation: boot-spin 0.85s linear infinite;
      }
      .boot-mark img {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        display: block;
        object-fit: cover;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-ring {
          animation: none;
          border-color: #c45c4a;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Chargement">
      <div class="boot-mark">
        <span class="boot-ring" aria-hidden="true"></span>
        <img src="logo.png" alt="" width="112" height="112" fetchpriority="high" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
